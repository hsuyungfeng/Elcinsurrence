[project]
name = "elc-audit-engine"
version = "0.1.0"
description = "電子抽審自動化病歷補強與申復生成引擎"
requires-python = ">=3.12"
dependencies = [
    "flask>=2.0",
    "python-dotenv>=0.19",
    "pandas>=2.0",
    "python-docx>=1.1.0",
    "pageindex>=0.1.0",
    "chromadb>=0.4.0",
    "requests>=2.28",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
