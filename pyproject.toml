[project]
name = "elc-audit-engine"
version = "0.1.0"
description = "電子抽審自動化病歷補強與申復生成引擎"
requires-python = ">=3.12"
# 依實際 import 收斂（P1-6）：pandas/pageindex 未在任何程式碼使用
# （pageindex 為雲端 SaaS，違反 D2 離線/不出本機，Phase 2 已改用自建
# docx 樹狀索引）。
# flask 為 server.py（Web 儀表板／Gateway API）實際依賴——P1-6 當時誤判
# 為未使用而移除，導致乾淨環境 `uv sync` 後 `python server.py` ImportError
# （P0-2 依賴漂移）；已還原。
dependencies = [
    "python-dotenv>=0.19",
    "python-docx>=1.1.0",
    "chromadb>=0.4.0",
    "requests>=2.28",
    "flask>=3.0",
]

# 紙本表格結構化 OCR（PP-StructureV3，可選）：不裝也能跑（降級 tesseract 行解析）。
# 版本釘選：paddlepaddle 3.3.1 在 CPU 有 oneDNN/PIR bug，須 3.2.2（deepflash4improve §8.2）。
[project.optional-dependencies]
ocr = [
    "paddlepaddle==3.2.2",
    "paddleocr==3.7",
    "paddlex[ocr]>=3.7,<3.8",
]

[dependency-groups]
dev = [
    "pypdf>=6.15.0",
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
