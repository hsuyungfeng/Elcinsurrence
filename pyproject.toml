[project]
name = "elc-audit-engine"
version = "0.1.0"
description = "電子抽審自動化病歷補強與申復生成引擎"
requires-python = ">=3.12"
# 依實際 import 收斂（P1-6）：pandas/pageindex 未在任何程式碼使用
# （pageindex 為雲端 SaaS，違反 D2 離線/不出本機，Phase 2 已改用自建
# docx 樹狀索引）。
# flask 為 server.py（Web 儀表板／Gateway API）實際依賴——P1-6 當時誤判
# 為未使用而移除，導致乾淨環境 `uv sync` 後 `python server.py` ImportError
# （P0-2 依賴漂移）；已還原。
dependencies = [
    "python-dotenv>=0.19",
    "python-docx>=1.1.0",
    "chromadb>=0.4.0",
    "requests>=2.28",
    "flask>=3.0",
    "pillow-heif>=1.5.0",
    "defusedxml>=0.7",
    # Phase 22-03（P1-13）：以下兩套件被 attachment_store.py、evidence_packet/pdf_exporter.py、
    # image_processor.py 於執行期頂層匯入，原先只在 dev 群組或僅由 pillow-heif 間接帶入。
    "pypdf>=4.0.0",
    "pillow>=10.0.0",
]

# 紙本表格結構化 OCR（PP-StructureV3，可選）：不裝也能跑（降級 tesseract 行解析）。
# 版本釘選：paddlepaddle 3.3.1 在 CPU 有 oneDNN/PIR bug，須 3.2.2（deepflash4improve §8.2）。
[project.optional-dependencies]
ocr = [
    "paddlepaddle==3.2.2",
    "paddleocr==3.7",
    "paddlex[ocr]>=3.7,<3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not live_llm" --cov=elc_audit_engine --cov-report=term:skip-covered'
markers = [
    "live_llm: 需要真實本機 LLM 服務（預設排除；以 -m live_llm 執行）",
]

# Phase 22-03（P1-14）：程式碼品質工具鏈。
[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["graphify-out", "officialdocument", "data", "doc", "research_notes", "reports"]

[tool.ruff.lint]
# E9：語法錯誤；F：未定義名稱、未使用匯入等（抓出 NameError 類缺陷）；
# W：空白；I：匯入排序；B：常見缺陷（含 bare except，B001／E722）。
select = ["E9", "F", "W", "I", "B"]
# 既有程式碼的風格約束，暫不強制（見 codeimproveplan.md）：
# B904：raise 未加 `from`，屬例外鏈風格，列入後續整理；B008／B905／I001 需大規模改寫。
ignore = ["B008", "B904", "B905", "I001"]

[tool.ruff.lint.per-file-ignores]
# 重新匯出（re-export）的 __init__.py 允許未使用匯入；測試允許以 Exception 作為斷言對象。
"**/__init__.py" = ["F401"]
"tests/**" = ["B017"]

[tool.coverage.run]
source = ["elc_audit_engine"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = false
