<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統運作狀態 - Elcinsurrence</title>
    <link rel="stylesheet" href="/static/css/status.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <span>診所主機運作狀態</span>
                <span id="overallBadge" class="overall-badge bg-unknown">檢測中</span>
            </h1>
            <div id="lastUpdated" class="message">最後更新時間：載入中...</div>
        </header>

        <div id="checksContainer">
            <div class="status-card">
                <div class="status-info">
                    <span class="indicator bg-unknown"></span>
                    <div>
                        <div class="name">載入中...</div>
                        <div class="message">正在取得系統六項健康指標...</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="refresh-hint">頁面每 30 秒自動重新整理一次</div>
    </div>
    <script src="/static/js/status.js"></script>
</body>
</html>
