<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初次設定 - ELC 健保核刪審查系統</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --warning-bg: #fef3c7;
            --warning-text: #92400e;
            --success-bg: #dcfce7;
            --success-text: #166534;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 18px;
            line-height: 1.6;
            padding: 32px 16px;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #1e293b;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .alert {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            display: none;
        }

        .alert-warning {
            background-color: var(--warning-bg);
            color: var(--warning-text);
            border: 1px solid #fde68a;
        }

        .alert-success {
            background-color: var(--success-bg);
            color: var(--success-text);
            border: 1px solid #bbf7d0;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .field-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        input[type="text"] {
            width: 100%;
            height: 44px;
            font-size: 18px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            transition: border-color 0.15s ease-in-out;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        input[disabled] {
            background-color: #f1f5f9;
            cursor: not-allowed;
        }

        .error-msg {
            color: var(--danger);
            font-size: 14px;
            margin-top: 4px;
            display: none;
        }

        .rooms-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .room-row {
            display: flex;
            gap: 12px;
            margin-bottom: 8px;
            align-items: center;
        }

        .room-row input {
            flex: 1;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 44px;
            padding: 0 20px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: background-color 0.15s ease;
            text-decoration: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            width: 100%;
            margin-top: 16px;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #334155;
            font-size: 15px;
            height: 36px;
            padding: 0 12px;
        }

        .btn-secondary:hover:not(:disabled) {
            background-color: #cbd5e1;
        }

        .btn-danger {
            background-color: transparent;
            color: var(--danger);
            font-size: 15px;
            height: 44px;
            padding: 0 12px;
        }

        .btn-danger:hover:not(:disabled) {
            background-color: #fee2e2;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .links-container {
            display: flex;
            gap: 16px;
            margin-top: 16px;
        }

        .links-container a {
            flex: 1;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>第一次設定</h1>
        <p class="subtitle" id="status-desc">請填寫診所基本資訊，完成後各診間即可自動連線。</p>

        <div id="alert-box" class="alert"></div>

        <form id="setup-form">
            <div class="form-group">
                <label for="facility-code">健保特約院所代碼 *</label>
                <input type="text" id="facility-code" placeholder="例：3501020000" maxlength="10">
                <div class="field-desc">健保局核發的 10 位數字代號。</div>
                <div class="error-msg" id="err-code"></div>
            </div>

            <div class="form-group">
                <label for="facility-name">醫療院所名稱 *</label>
                <input type="text" id="facility-name" placeholder="例：大安健保診所" maxlength="64">
                <div class="field-desc">診所正式全名，將顯示於報表與快捷列。</div>
                <div class="error-msg" id="err-name"></div>
            </div>

            <div class="form-group">
                <label for="physician-name">主要負責醫師姓名</label>
                <input type="text" id="physician-name" placeholder="例：王大明" maxlength="64">
                <div class="field-desc">負責醫師或院長姓名（可選填）。</div>
                <div class="error-msg" id="err-physician"></div>
            </div>

            <div class="form-group">
                <div class="rooms-header">
                    <div>
                        <label>診間清單 *</label>
                        <div class="field-desc">各診間電腦連線時將顯示此清單供醫師選擇。</div>
                    </div>
                    <button type="button" class="btn btn-secondary" id="btn-add-room">+ 新增診間</button>
                </div>
                <div id="rooms-container"></div>
                <div class="error-msg" id="err-rooms"></div>
            </div>

            <button type="submit" class="btn btn-primary" id="btn-submit">完成設定</button>
        </form>

        <div id="success-actions" style="display: none; margin-top: 24px;">
            <div class="links-container">
                <a href="/" class="btn btn-primary" style="margin-top: 0;">前往審查工作台</a>
                <a href="/status" class="btn btn-secondary" style="height: 44px; display: inline-flex; align-items: center; justify-content: center;">查看系統狀態</a>
            </div>
        </div>
    </div>

    <script src="/static/js/setup.js"></script>
</body>
</html>
